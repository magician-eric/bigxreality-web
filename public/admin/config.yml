    media_folder: /src/assets/images/content
    public_folder: ../../../assets/images/content
    fields:
      - name: translationStatus
        label: 翻譯狀態
        required: true
        widget: select
        options: *a128
        default: pending
      - *a129
      - *a130
      - *a131
      - *a132
      - *a133
      - *a134
      - *a135
      - *a136
      - *a137
  - name: news-media
    label: 新聞共用圖集與影片（進階）
    files:
      - name: registry
        label: 新聞媒體資料
        file: src/data/news-media.json
        format: bxr-media-json
        fields:
          - name: body
            label: 媒體對應表
            widget: bxr-value
            required: true
            value_schema:
              type: object
              additionalProperties:
                type: object
                properties:
                  publicationDate:
                    anyOf:
                      - type: string
                        pattern: ^\d{4}-\d{2}-\d{2}$
                      - type: "null"
                  cover: &a139
                    type: object
                    required:
                      - filename
                      - approved
                    properties:
                      filename:
                        type: string
                        pattern: ^[a-z0-9-]+\.(jpg|jpeg|png)$
                      approved:
                        type: boolean
                      alt: &a138
                        type: object
                        properties:
                          tw:
                            type: string
                          en:
                            type: string
                          jp:
                            type: string
                        additionalProperties: false
                      caption: *a138
                    additionalProperties: false
                  gallery:
                    type: array
                    items: *a139
                  videos:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - url
                      properties:
                        type:
                          enum:
                            - youtube
                            - facebook
                            - local
                        url:
                          type: string
                          pattern: ^(https://|/media/news/)
                        embedApproved:
                          type: boolean
                        approved:
                          type: boolean
                        title: *a138
                        poster:
                          type: string
                      additionalProperties: false
                  sourceLinks:
                    type: array
                    items:
                      type: string
                      pattern: ^https://
                additionalProperties: false
            hint: 完整沿用現有 mediaId→媒體物件。圖檔在 src/assets/images/news/，filename 只填檔名；approved=true 且三語 alt 完整才顯示。
  - name: cms-test
    label: 隔離測試文章（不會顯示於官網）
    folder: cms-test-content
    create: true
    delete: true
    extension: md
    format: frontmatter
    media_folder: /cms-test-media
    public_folder: ../cms-test-media
    fields:
      - name: title
        label: 標題
        widget: string
      - name: date
        label: 日期
        widget: datetime
        required: false
        format: YYYY-MM-DD
        time_format: false
      - name: image
        label: 測試圖片
        widget: image
        required: false
      - name: body
        label: 內文
        widget: markdown
        required: false
