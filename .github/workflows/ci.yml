name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      BXR_CONTENT_SOURCE: markdown
      BXR_PREVIEW: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Sveltia schema and content compatibility
        run: npm run cms:sveltia:check
      - name: Sveltia real-browser isolated editing
        run: npm run qa:sveltia
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npx astro check
      # Git main is the only official content source. No remote CMS is queried.
      - name: Build
        run: npm run build
      - run: npm run qa:technologies
      - run: npm run qa:news-preview
      - run: npm run qa:news-media
      - run: npm run qa:csr
      - run: npm run qa:news-import
      - run: npm run qa:ui-v1
      - run: npm run qa:hero-framing
      - run: npm run qa:typography
      - run: npm run qa:media-composition
      - name: Visual review artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-copy-review
          path: |
            docs/reviews/visual-copy/
            docs/reviews/typography/
          retention-days: 14
      - run: npm run qa:ui-v1-preview
      - run: npm run qa:client-logos
      - run: npm run qa:images
      - run: npm run qa:seo
      - run: npm run check:sitemap
      - run: npm run qa:links
      - run: npm run qa:behaviour
      - run: npm run qa:motion
      - run: npm run qa:density-navigation
      - run: npm run qa:header
      - run: npm run qa:footer
      - run: npm run qa:solutions
      - run: npm run qa:company
      - run: npm run qa:team
      - run: npm run qa:english
      - run: npm run qa:japanese
      - run: npm run qa:faq
      # TEST FIXTURE content: pages, search and accessibility of phase 2 templates
      - name: Build test fixtures
        run: npm run build:fixtures
      - run: QA_DIST=dist-fixtures/client npm run qa:technologies
      - run: npm run qa:phase2
      - run: QA_DIST=dist-fixtures/client npm run qa:company
      - run: npm run qa:search
      - run: QA_DIST=dist-fixtures/client npm run qa:a11y -- /tw/solutions/police/ /tw/news/ /tw/news/fixture-news-02/ /tw/cases/fixture-case-1/ /tw/tags/xr-training/ /tw/search/
      - name: Package the verified Pages artifact
        run: npm run pages:package && npm run pages:check
      - name: Publish build summary
        if: always()
        run: |
          echo "## BXR website" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "CMS target: main; source: Git Markdown; hosting: GitHub Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages publication requires every build-and-test step to pass." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist-pages
  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
