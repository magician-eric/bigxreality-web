# Review site on GitHub Pages: https://magician-eric.github.io/bigxreality-web/
# Built from the Markdown in this repository on every push to main (or by hand from
# the Actions tab). Every page is noindex and robots.txt blocks crawlers; TEST FIXTURE
# content cannot be included (the build fails if it appears). This is not the
# production deployment and does not touch Cloudflare. See docs/PREVIEW.md.
name: Preview (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Build (Markdown content, noindex)
        run: npm run build
        env:
          BXR_PREVIEW: "1"
      - name: Move the site under /${{ github.event.repository.name }}/
        run: node scripts/preview/rebase.mjs /${{ github.event.repository.name }}/
      - name: Check the preview (links, noindex, no test data, search)
        run: node scripts/preview/check.mjs /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-preview
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
